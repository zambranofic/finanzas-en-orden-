name: FINORVE Quality Gate

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm test includes UI quality regression checks
      - name: Financial engine tests
        run: npm test
      - name: JavaScript syntax checks
        run: |
          node --check financial-engine.js
          node --check certification-fixtures.js
          node --check supabase-store.js
          node --check sync-utils.js
          node --check profile-utils.js
          node --check auth-session-utils.js
          node --check password-policy.js
          node --check checkout-security-utils.js
          node --check navigation-utils.js
          node --check app-v4.js
